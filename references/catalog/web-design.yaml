- id: chrome-devtools-mcp
  name: Chrome DevTools MCP
  kind: mcp
  area: web-design
  what: 실제 Chrome을 DevTools 수준으로 다루는 공식 MCP 서버로, 성능 트레이스·네트워크·콘솔·CSS 조회와 Lighthouse 감사(접근성·SEO·모범 사례)를 에이전트가 직접 돌릴 수 있다.
  when: LCP 같은 성능 지표나 Lighthouse 점수로 페이지 품질을 수치로 확인하고 싶을 때, 레이아웃 버그를 실제 계산된 스타일로 디버깅할 때.
  not_when: 스크린샷만 필요한 단순 확인(agent-browser 등이 가벼움). Google으로 사용 통계·CrUX 조회가 나가면 안 되는 환경에서 옵트아웃 없이 쓸 때.
  install: |
    claude mcp add chrome-devtools --scope user npx chrome-devtools-mcp@latest
    # 플러그인(MCP + 스킬):
    /plugin marketplace add ChromeDevTools/chrome-devtools-mcp
    /plugin install chrome-devtools-mcp@chrome-devtools-plugins
    # 공식 마켓플레이스에도 chrome-devtools-mcp 로 등록돼 있음
    # 통계 끄기: args에 --no-usage-statistics, CrUX 끄기: --no-performance-crux
  verify: 재시작 후 /mcp 또는 /skills로 확인, "Check the performance of https://developers.chrome.com" 요청 시 트레이스가 기록되는지 확인.
  repo: https://github.com/ChromeDevTools/chrome-devtools-mcp
  docs: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/tool-reference.md
  license: Apache-2.0
  stars: 54853
  last_push: 2026-11-05
  maintained: true
  cost: free
  needs: Node LTS, npm, Chrome 최신 안정판
  overlaps: [lighthouse-cli, playwright-mcp, agent-browser, axe-cli]
  risks: 사용 통계가 기본으로 Google에 전송됨(--no-usage-statistics로 끔). 성능 도구가 트레이스 URL을 CrUX API로 보낼 수 있음. --scope user는 전역 등록. 로그인된 브라우저 상태를 에이전트가 볼 수 있음.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://api.github.com/repos/ChromeDevTools/chrome-devtools-mcp
  - https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/README.md
  - https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/client-configurations.md
  - https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/tool-reference.md

- id: figma-mcp
  name: Figma MCP server (remote)
  kind: mcp
  area: web-design
  what: Figma 파일의 프레임·변수(토큰)·컴포넌트 정보를 읽어 코드로 옮기고, 원격 서버에서는 캔버스에 직접 쓰기도 하는 Figma 공식 MCP 서버다.
  when: 디자이너가 만든 Figma 시안이 있고 그걸 코드로 정확히 옮기거나, 디자인 토큰을 Figma 변수에서 가져올 때.
