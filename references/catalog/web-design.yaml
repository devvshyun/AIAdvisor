- id: playwright-mcp
  name: Playwright MCP (Microsoft)
  kind: mcp
  area: web-design
  also: [coding, automation]
  what: Playwright로 브라우저를 열고 접근성 트리 기반으로 조작하는 MCP 서버로, 상태를 유지한 채 탐색·폼 입력·스크린샷을 할 수 있다.
  when: 여러 단계에 걸친 사용자 흐름을 계속 같은 브라우저 상태로 탐색해야 할 때, 공식 마켓플레이스 플러그인으로 간단히 붙이고 싶을 때. 웹 UI 변경을 실제 브라우저로 확인하며 E2E 시나리오를 탐색할 때, 반복 웹 작업을 자동화할 때.
  not_when: 스크린샷 몇 장만 필요한 일반적인 화면 검증(Microsoft도 코딩 에이전트에는 CLI+스킬 방식이 토큰 효율이 좋다고 안내함). 토큰이 빠듯한 긴 세션.
  install: |
    claude mcp add playwright npx @playwright/mcp@latest
    # 또는 공식 마켓플레이스 플러그인: /plugin install playwright@claude-plugins-official
    # 추가 기능은 --caps=vision,pdf,devtools 등으로 선택
    # 자동화용 옵션: --headless, --isolated, --storage-state <file>
  verify: '`claude mcp list`에 playwright가 보이고, /mcp에서 연결 상태 확인 후 "example.com 열고 스크린샷" 요청.'
  repo: https://github.com/microsoft/playwright-mcp
  docs: https://github.com/microsoft/playwright-mcp#readme
  license: Apache-2.0
  stars: 39233
  last_push: 2026-11-05
  maintained: true
  cost: free
  needs: Node 18+
  overlaps: [playwright-cli, agent-browser, chrome-devtools-mcp]
  risks: 도구 스키마와 접근성 스냅샷이 컨텍스트를 많이 차지함. 브라우저가 임의 사이트에 접속하므로 민감한 URL 파라미터는 --redact-url-params 고려. README가 스스로 보안 경계가 아니라고 밝히며 --allowed-origins도 보안 장치가 아니다. 저장된 세션·쿠키(storage-state)는 비밀값이다. 방문한 페이지 텍스트가 프롬프트 인젝션 경로가 된다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://api.github.com/repos/microsoft/playwright-mcp
  - https://github.com/microsoft/playwright-mcp/blob/main/README.md
