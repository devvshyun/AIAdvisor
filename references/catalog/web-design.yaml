  kind: cli
  area: web-design
  what: 에이전트용 브라우저 자동화 CLI로, 페이지 열기·클릭·스냅샷·스크린샷을 짧은 명령으로 처리해 MCP보다 적은 컨텍스트로 화면을 확인하게 해 준다.
