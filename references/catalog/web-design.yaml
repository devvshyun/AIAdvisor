  maintained: true
  cost: needs account (Starter·View·Collab 좌석은 월 6회 호출 제한, Dev/Full 좌석 유료 플랜 권장)
  needs: Figma 계정과 OAuth, 실사용에는 유료 플랜 Dev/Full 좌석
  overlaps: [shadcn-mcp, awesome-design-md]
