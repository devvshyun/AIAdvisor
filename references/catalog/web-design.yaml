- id: shadcn-mcp
  name: shadcn MCP server (+ shadcn skill)
  kind: mcp
  area: web-design
  what: shadcn/ui 레지스트리의 컴포넌트를 검색·조회·설치하게 해 주는 MCP 서버로, 별도 skill은 프로젝트 설정(components.json)을 읽어 shadcn CLI·테마 지식을 준다.
  when: shadcn/ui를 쓰는 React/Next 프로젝트에서 컴포넌트를 손으로 만들지 않고 레지스트리에서 가져오고 싶을 때.
  not_when: shadcn/ui를 쓰지 않거나 components.json이 없는 프로젝트. 기본 shadcn 모양 그대로가 '흔한 AI 화면'으로 보일까 걱정될 때(테마 커스터마이즈 없이 쓰면 오히려 뻔해짐).
  install: |
    pnpm dlx shadcn@latest mcp init --client claude
    # npm 사용 시 npx shadcn@latest mcp init --client claude
    # 수동: .mcp.json 에 {"mcpServers":{"shadcn":{"command":"npx","args":["shadcn@latest","mcp"]}}}
    # 스킬: pnpm dlx skills add shadcn/ui
  verify: Claude Code 재시작 후 /mcp 에서 shadcn이 Connected인지 확인, "shadcn 레지스트리 컴포넌트 목록 보여줘"로 테스트.
  repo: https://github.com/shadcn-ui/ui
  docs: https://ui.shadcn.com/docs/mcp
  license: MIT
  stars: 127448
  last_push: 2026-11-05
  maintained: true
  cost: free
  needs: Node, 프로젝트에 components.json과 shadcn, 레지스트리 네트워크 접근, 사설 레지스트리는 토큰(.env.local)
  overlaps: [figma-mcp]
  risks: 레지스트리 코드를 프로젝트에 그대로 추가하므로 제3자 레지스트리는 내용 확인 필요. 사설 레지스트리 토큰 관리.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://api.github.com/repos/shadcn-ui/ui
  - https://ui.shadcn.com/docs/mcp
  - https://ui.shadcn.com/docs/skills

- id: agent-browser
