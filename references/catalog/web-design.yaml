  overlaps: [impeccable]
  risks: 전체 설치 시 Swift, Expo 등 웹과 무관한 스킬도 함께 들어와 스킬 목록이 늘어난다. --skill로 골라 설치 권장.
  always_on_tokens: null
  hands_on: '2026-11-06: 데모 페이지의 버튼 누름, 감속 곡선, 마우스 환경 한정 호버에 적용했다. 섹션마다 반복하던 페이드인은 빼고 클릭 탭으로 바꿨다'
  source_checked: 2026-11-06
