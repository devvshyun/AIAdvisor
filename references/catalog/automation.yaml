- id: zapier-mcp
  name: Zapier MCP
  kind: mcp
  area: automation
  what: Zapier에 연결된 수천 개 앱의 액션을 Claude Code에서 원격 MCP 도구로 호출하게 해 주는 호스팅 서비스다.
  when: 이미 Zapier를 쓰고 있고, 코드 없이 Gmail·Slack·스프레드시트 등에 쓰기 작업을 Claude가 하게 하고 싶을 때.
  not_when: 호출량이 많은 반복 작업(호출당 Zap 작업 2개 소모), 데이터를 외부 SaaS에 맡기기 어려울 때, 자체 호스팅이 필요할 때.
  install: |
    claude mcp add --transport http "Zapier-MCP" https://mcp.zapier.com/api/v1/connect
    → Claude Code 재시작 → 브라우저에서 Zapier 로그인·Allow → 복사한 온보딩 프롬프트를 Claude Code에 붙여넣기.
    Team/Enterprise는 Owner 승인이 필요할 수 있고, 조직 커넥터가 이미 있으면 추가하지 말 것.
    Windows: WSL에서는 브라우저 콜백이 Claude Code에 닿지 않을 수 있어 네이티브 Windows 터미널에서 실행 권장(공식 문서).
  verify: '`claude mcp list` 에서 Zapier-MCP 연결 확인 → 연결한 앱에서 목록 조회 같은 읽기 전용 액션 1회 실행 → Zapier MCP History에 기록 확인.'
