- id: inbox-zero
  name: Inbox Zero
  kind: service
  area: automation
  what: Gmail·Outlook 메일을 AI 규칙으로 분류하고 답장 초안·첨부 정리까지 해 주는 오픈소스 메일 비서로, 호스팅 버전과 자체 호스팅을 모두 제공한다.
  when: 프로젝트 관련 메일(문의, 알림, 뉴스레터)이 실제 병목이고 규칙 기반 자동 분류·초안 작성이 필요할 때.
  not_when: 코드·CI 자동화가 목적일 때(범위 밖), 메일 계정 OAuth와 LLM 키를 외부 서비스나 자체 서버에 맡기기 어려울 때.
  install: |
    호스팅: https://www.getinboxzero.com 가입.
    자체 호스팅(Docker + Node.js 24+): npx @inbox-zero/cli setup → npx @inbox-zero/cli start → http://localhost:3000
    운영 배포·Google/Microsoft OAuth 설정은 self-hosting 문서 참조.
    Windows: 로컬 개발 모드는 macOS/Linux 기준(Windows는 WSL). 자체 호스팅은 Docker Desktop 필요.
  verify: http://localhost:3000 접속 → 메일 계정 연결 후 테스트 규칙 1개를 만들어 새 메일에 라벨이 붙는지 확인.
