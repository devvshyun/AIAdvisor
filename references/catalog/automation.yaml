# area: automation
# 형식은 SCHEMA.md, 갱신 절차는 REFRESH.md. 기준일은 항목마다 source_checked.

- id: claude-code-action
  name: Claude Code GitHub Action (anthropics/claude-code-action)
  kind: github-action
  area: automation
  what: GitHub 워크플로 안에서 Claude Code를 돌려 @claude 멘션에 답하거나 정해진 프롬프트로 PR 리뷰·리포트 같은 작업을 자동 실행한다.
  when: 이슈/PR에서 바로 Claude에게 일을 시키고 싶을 때, 혹은 cron 스케줄로 주간 리포트·정기 점검을 YAML로 버전 관리하며 돌리고 싶을 때.
  not_when: GitHub이 아닌 저장소(GitLab은 별도 문서), 워크플로 파일 관리 없이 PR 자동 리뷰만 원할 때(Code Review 기능이 더 단순), 저장소 관리자 권한이 없을 때.
  install: |
    빠른 설정(관리자 권한 + gh CLI 로그인 필요): claude 실행 후 /install-github-app
      → Claude GitHub App 설치, ANTHROPIC_API_KEY 또는 CLAUDE_CODE_OAUTH_TOKEN 시크릿 저장, 워크플로 PR 생성.
    수동 설정:
      1) https://github.com/apps/claude 설치
      2) 저장소 Secrets에 ANTHROPIC_API_KEY(Claude Console) 또는 CLAUDE_CODE_OAUTH_TOKEN(로컬에서 `claude setup-token`) 추가
      3) examples/claude.yml을 .github/workflows/에 복사, `uses: anthropics/claude-code-action@v1`
    스케줄 실행: on.schedule cron + `prompt:` 입력 + `claude_args: --allowedTools ... --max-turns N`.
    Windows: 설정 자체는 OS 무관(러너는 ubuntu-latest). /install-github-app은 gh CLI가 설치·로그인돼 있어야 함.
  verify: 워크플로 머지 후 이슈나 PR 코멘트에 "@claude hello"를 남겨 Claude 응답 코멘트가 달리는지 확인. 스케줄형은 workflow_dispatch로 1회 수동 실행 후 Actions 로그 확인.
  repo: https://github.com/anthropics/claude-code-action
  docs: https://code.claude.com/docs/en/github-actions
  license: MIT
  stars: 9798
  last_push: 2026-11-04
  maintained: true
  cost: needs account (GitHub Actions 분 + Claude API 토큰 과금, 또는 구독 OAuth 토큰 사용)
  needs: [저장소 admin 권한, ANTHROPIC_API_KEY 또는 CLAUDE_CODE_OAUTH_TOKEN 시크릿, Claude GitHub App 설치(또는 커스텀 앱)]
  overlaps: [claude-cloud-scheduled-tasks, github-mcp]
  risks: 공식 GitHub App은 Actions·Workflows 쓰기까지 포함한 권한 묶음 전체를 받는다(최소 권한이 필요하면 커스텀 앱). 실행마다 Actions 분과 토큰이 같이 나가므로 --max-turns, timeout-minutes, concurrency 없이 pull_request 트리거를 걸면 비용이 불어난다. 키는 Secrets에만 두고, 시크릿을 지워도 키는 살아 있으니 콘솔에서 폐기해야 한다. 기본 GITHUB_TOKEN 커밋은 CI를 트리거하지 않는다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://code.claude.com/docs/en/github-actions
  - https://github.com/anthropics/claude-code-action
  - https://api.github.com/repos/anthropics/claude-code-action

- id: claude-code-hooks
  name: Claude Code hooks
  kind: built-in
  area: automation
  also: [coding]
  what: Claude Code 수명주기(도구 사용 전후, 알림, 세션 시작, 종료 등)의 정해진 시점에 셸 명령·프롬프트·MCP 도구를 결정적으로 실행시키는 내장 기능이다.
  when: 편집 후 자동 포맷, 위험 명령 차단, 보호 파일 수정 막기, 입력 대기 시 데스크톱 알림처럼 "매번 반드시" 일어나야 하는 규칙이 있을 때. 편집 후 항상 포매터, 커밋 전 테스트처럼 코딩 규칙을 강제할 때.
  not_when: 판단이 필요한 일을 셸 스크립트로 억지로 표현하려 할 때(스킬·서브에이전트가 맞음), 출처를 모르는 저장소의 프로젝트 훅을 검토 없이 켤 때.
  install: |
    ~/.claude/settings.json(사용자), .claude/settings.json(프로젝트), .claude/settings.local.json(로컬)에 "hooks" 블록 추가.
    예: "hooks": { "Notification": [ { "matcher": "", "hooks": [ { "type": "command", "command": "<알림 명령>" } ] } ] }
    Windows 알림 예(공식 문서): "command": "powershell.exe -Command \"[System.Reflection.Assembly]::LoadWithPartialName('System.Windows.Forms'); [System.Windows.Forms.MessageBox]::Show('Claude Code needs your attention', 'Claude Code')\""
      (메시지 박스라 터미널 뒤에 뜰 수 있음. WSL이면 powershell.exe가 PATH에 있어야 함.)
    Windows에서 파일 변경을 전부 잡으려면 matcher에 Bash|PowerShell을 같이 넣으라고 문서가 안내.
    전체 끄기: "disableAllHooks": true
  verify: Claude Code에서 /hooks 를 입력해 해당 이벤트 아래 훅이 보이는지 확인 → 실제 트리거 동작 수행. 오류 전문은 `claude --debug` 또는 세션 중 /debug.
  repo: null
  docs: https://code.claude.com/docs/en/hooks-guide
  license: null
  stars: null
  last_push: null
  maintained: true
  cost: free
  needs: [Claude Code]
  overlaps: [ntfy, ecc, security-guidance, semgrep-guardian]
  risks: 훅은 사용자 권한으로 임의 명령을 실행하므로 프로젝트 settings.json에 들어 있는 훅은 코드 실행과 같다. PermissionRequest 훅에 빈 matcher를 쓰면 모든 권한 프롬프트를 자동 승인한다. exit 0은 승인이 아니고 exit 2가 차단이라는 규칙을 헷갈리면 안전장치가 무력해진다. 훅 출력이 컨텍스트에 추가되는 이벤트(SessionStart 등)는 토큰을 쓴다. stdout이 컨텍스트에 붙으므로 출력이 길면 토큰을 먹는다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://code.claude.com/docs/en/hooks-guide
  - https://code.claude.com/docs/en/hooks
  - https://code.claude.com/docs/en/commands

- id: claude-cloud-scheduled-tasks
  name: Claude Code cloud scheduled tasks (구 routines, /schedule)
  kind: built-in
  area: automation
  what: 프롬프트·저장소·커넥터를 묶어 Anthropic 클라우드에서 일정, API 호출, GitHub 이벤트에 맞춰 자동 실행하는 Claude Code 예약 작업이다.
  when: 노트북이 꺼져 있어도 매일/매주 PR 요약, 백로그 정리, 의존성 점검 같은 일을 돌리고 결과를 Slack·이슈로 받고 싶을 때.
  not_when: 로컬 파일이나 로컬 전용 MCP가 필요할 때(Desktop 예약 작업), 1시간보다 짧은 간격이 필요할 때, API 키/Bedrock 등으로만 인증하는 환경, 공유·팀 단위 소유가 필요할 때(개인 계정 소유).
  install: |
    요구: Pro/Max/Ultra/Team/Enterprise 구독 로그인(Console API 키, Bedrock/Vertex/Foundry 로그인에서는 /schedule이 숨겨짐; ANTHROPIC_API_KEY 환경 변수가 있으면 제거).
    CLI: /schedule  (예: /schedule daily PR review at 9am, 별칭 /routines)
    관리: /schedule list, /schedule update, /schedule run
    웹: https://claude.ai/code/routines 에서 New → 저장소·환경·트리거·커넥터 설정 → Create.
    연구 프리뷰 기능이라 동작·한도가 바뀔 수 있음.
  verify: 작업 상세 페이지에서 Run now → 실행 기록 상태 확인 후 transcript를 직접 열어 차단된 네트워크 요청·누락 도구가 없는지 확인. CLI에서는 `/schedule why did my <task> do nothing` 으로 최근 실행 로그 요약을 요청할 수 있음.
  repo: null
  docs: https://code.claude.com/docs/en/routines
  license: null
  stars: null
  last_push: null
  maintained: true
  cost: needs account (구독 사용량 차감, 사용 크레딧 켜면 초과분 과금)
  needs: [claude.ai 유료 구독, GitHub 연결(저장소 클론용), 필요 시 claude.ai 커넥터]
  overlaps: [claude-code-action, claude-local-scheduling]
  risks: 실행은 기본 auto mode로 돌고 포함된 커넥터로 쓰기까지 한다(생성 시 연결된 커넥터가 전부 기본 포함). 커밋·Slack 메시지 등은 모두 내 계정 명의로 나간다. claude/ 브랜치에 push하지만 연결된 GitHub 계정이 우회 가능한 보호 규칙은 막지 못한다. API 트리거 토큰은 비밀값이다. 시간당 실행 한도는 있지만 구독 사용량은 계속 깎이고, 사용 크레딧을 켜면 초과 과금된다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://code.claude.com/docs/en/routines
  - https://code.claude.com/docs/en/scheduled-tasks

- id: claude-local-scheduling
  name: Claude Code Desktop 로컬 예약 작업 + /loop
  kind: built-in
  area: automation
  what: 내 PC에서 Desktop 앱이 정해진 일정에 새 세션을 띄우거나(/loop은 열린 세션 안에서) 프롬프트를 반복 실행하는 로컬 스케줄 기능이다.
  when: 로컬 파일·로컬 MCP·미커밋 변경이 필요한 정기 작업(Desktop), 또는 세션 중 배포 완료·CI 상태를 몇 분 간격으로 확인할 때(/loop).
  not_when: PC가 꺼지거나 잠드는 시간에도 돌아야 할 때, 7일 넘게 이어질 반복을 /loop으로 하려 할 때(자동 만료), 팀이 공유해야 하는 작업.
  install: |
    Desktop(1.1.5368 이상): Code 탭 → Scheduled → New task → Advanced settings에서 "Only on this computer" 켜기 → 폴더·일정·권한 모드 선택 → Create.
      프롬프트 파일: ~/.claude/scheduled-tasks/<task-name>/SKILL.md
    /loop(CLI 세션): /loop 5m check if the deployment finished  (간격 생략 시 Claude가 1분~1시간 사이로 조절)
      목록/취소: "what scheduled tasks do I have?", "cancel the deploy check job" (CronList/CronDelete)
      기본 프롬프트 교체: .claude/loop.md 또는 ~/.claude/loop.md
      끄기: CLAUDE_CODE_DISABLE_CRON=1
    Windows: Desktop 앱은 Windows 지원. 절전 방지는 Settings의 Keep computer awake.
  verify: Desktop은 생성 직후 Run now → 권한 프롬프트마다 always allow → History에 실행 기록 확인. /loop은 생성 시 출력되는 job ID와 "next run" 시간을 확인하고 CronList로 재확인.
  repo: null
  docs: https://code.claude.com/docs/en/desktop-scheduled-tasks
  license: null
  stars: null
  last_push: null
  maintained: true
  cost: needs account (Claude Code 사용량 차감)
  needs: [Claude Desktop 앱 또는 Claude Code CLI 세션, PC가 켜져 있고 깨어 있을 것]
  overlaps: [claude-cloud-scheduled-tasks]
  risks: 기본적으로 작업 폴더의 현재 상태(미커밋 변경 포함)에서 돌아가므로 Worktree 옵션을 켜는 편이 안전하다. always allow로 승인한 도구는 이후 실행에서 묻지 않는다. /loop을 짧은 간격으로 두면 토큰을 빠르게 소모한다. PC가 잠들면 회차가 건너뛰어지고 깨어날 때 1회만 몰아서 실행되므로 시점 가드를 프롬프트에 넣어야 한다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://code.claude.com/docs/en/desktop-scheduled-tasks
  - https://code.claude.com/docs/en/scheduled-tasks

- id: github-pages-deploy
  name: GitHub Pages 배포 (actions/upload-pages-artifact + actions/deploy-pages)
  kind: github-action
  area: automation
  what: 빌드한 정적 파일을 아티팩트로 올린 뒤 OIDC 인증으로 GitHub Pages에 배포하는 GitHub 공식 액션 조합이다.
  when: 문서 사이트·데모 페이지를 push마다 자동으로 다시 빌드해서 github.io에 올리고 싶을 때.
  not_when: 서버가 필요한 앱, 1GB를 넘는 사이트, GitHub Enterprise Server(README 호환표상 v4 비호환, v5는 미확인), 이미 Vercel/Netlify/Cloudflare Pages로 배포 중일 때.
  install: |
    1) Settings → Pages → Source를 "GitHub Actions"로.
    2) 워크플로: build 잡에서 빌드 후 `actions/upload-pages-artifact@v5` (with: path: <빌드 폴더>),
       deploy 잡에서 `actions/deploy-pages@v5`
       (최신 릴리스: deploy-pages v5.0.1 2026-09-01, upload-pages-artifact v5.0.0 2026-04-10. README 예시는 아직 v4/v3 표기) + permissions { pages: write, id-token: write } + environment: github-pages.
    3) concurrency group: pages 권장. Windows 차이 없음(러너에서 실행).
  verify: Actions 탭에서 deploy 잡 성공 + steps.deployment.outputs.page_url 출력 확인 → 해당 URL에 `curl -sI <page_url>` 로 200 응답 확인.
  repo: https://github.com/actions/deploy-pages
  docs: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
  license: MIT
  stars: 967
  last_push: 2026-09-07
  maintained: true
  cost: free (공개 저장소; 비공개 저장소 Pages는 GitHub 유료 플랜 필요, Actions 분 소모)
  needs: [GitHub 저장소, Pages 활성화]
  overlaps: []
  risks: deploy 잡에만 pages:write, id-token:write를 주고 워크플로 기본은 contents:read로 둔다. github-pages 환경에 배포 브랜치 보호를 걸지 않으면 다른 브랜치 워크플로가 사이트를 덮어쓸 수 있다. 아티팩트에 빌드 산출물 외 파일(.env 등)이 섞이면 그대로 공개된다. 심볼릭 링크가 있으면 업로드가 실패한다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://github.com/actions/deploy-pages
  - https://github.com/actions/upload-pages-artifact
  - https://api.github.com/repos/actions/deploy-pages
  - https://api.github.com/repos/actions/upload-pages-artifact

- id: lychee-action
  name: lychee-action (+ peter-evans/create-issue-from-file)
  kind: github-action
  area: automation
  what: 문서·사이트의 링크를 검사하고, 깨진 링크가 있으면 결과 마크다운으로 이슈를 자동 생성하는 정기 헬스체크 조합이다.
  when: 문서·데모 사이트를 cron으로 주기 점검하고 문제를 이슈로 받고 싶을 때.
  not_when: 페이지 렌더링·기능 동작까지 확인해야 할 때(Playwright 스모크 테스트가 맞음), 링크가 거의 없는 저장소.
  install: |
    .github/workflows/links.yml 예:
      on: schedule(cron) + workflow_dispatch
      permissions: issues: write
      - uses: lycheeverse/lychee-action@v2   (with: fail: false, args: ...)
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6  (content-filepath: ./lychee/out.md; README 예시는 v5, 최신 릴리스 v6.0.0)
    Windows 차이 없음(러너에서 실행). 로컬 실행은 lychee CLI 별도 설치.
  verify: workflow_dispatch로 수동 실행 → 정상 시 이슈 없음, 깨진 링크를 넣은 브랜치에서 실행 시 이슈 생성되는지 확인.
  repo: https://github.com/lycheeverse/lychee-action
  docs: https://github.com/lycheeverse/lychee-action#readme
  license: Apache-2.0 OR MIT
  stars: 526
  last_push: 2026-07-09
  maintained: true
  cost: free
  needs: [GitHub Actions, 'issues:write 권한']
  overlaps: [playwright-cli, claude-code-action]
  risks: 공개 저장소는 60일 무활동 시 schedule 워크플로가 꺼져 "이슈가 없다=건강"으로 오해할 수 있다. 매번 새 이슈를 만들면 중복 이슈가 쌓인다. 외부 사이트에 요청을 보내므로 rate limit·차단을 받을 수 있다(GITHUB_TOKEN 전달 시 GitHub 링크 한도 완화).
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://github.com/lycheeverse/lychee-action
  - https://github.com/peter-evans/create-issue-from-file
  - https://api.github.com/repos/lycheeverse/lychee-action
  - https://api.github.com/repos/peter-evans/create-issue-from-file

- id: n8n-mcp
  name: n8n (instance-level MCP server)
  kind: service
  area: automation
  what: 노드 기반 워크플로 자동화 도구 n8n의 인스턴스 MCP 서버로, Claude Code가 허용된 n8n 워크플로를 검색·실행·편집할 수 있게 한다.
  when: 여러 SaaS를 잇는 반복 업무를 자체 호스팅으로 돌리고 싶고, 그 워크플로를 Claude에서 도구처럼 호출하고 싶을 때.
  not_when: 단순한 알림 한두 개(ntfy·훅으로 충분), 서버 운영 부담을 지기 싫을 때(n8n Cloud는 유료), 클라이언트별로 접근 범위를 나눠야 할 때(클라이언트 단위 스코프 없음).
  install: |
    n8n 실행: Node.js 20.19~24.x 필요. `npx n8n` 또는 `npm install n8n -g` 후 `n8n` → http://localhost:5678
      (npm 설치는 n8n 3.0부터 deprecated, 운영은 Docker 권장)
    MCP 켜기: Settings → Instance-level MCP → Enable MCP access (owner/admin). 워크플로별로 "Available in MCP" 켜야 노출.
    Claude Code 연결(OAuth): claude mcp add --transport http n8n https://<your-n8n-domain>/mcp-server/http  → Claude Code에서 /mcp 로 n8n 선택해 인증
    API 키 방식: claude mcp add --transport http n8n-mcp https://<your-n8n-domain>/mcp-server/http --header "Authorization: Bearer <YOUR_N8N_MCP_TOKEN>"
    Windows: n8n 문서는 Windows 전용 명령이 없고 Node.js 설치만 안내. 클라우드 MCP 클라이언트는 공개 접근 가능한 인스턴스 필요.
  verify: '`claude mcp list` 에 n8n이 connected로 보이는지 → Claude에게 search_workflows 실행을 요청해 MCP 허용 워크플로가 보이는지 확인.'
  repo: https://github.com/n8n-io/n8n
  docs: https://docs.n8n.io/advanced-ai/accessing-n8n-mcp-server/
  license: 'Sustainable Use License (API: NOASSERTION; 일부 .ee 파일은 n8n Enterprise License)'
  stars: 209638
  last_push: 2026-11-05
  maintained: true
  cost: free (자체 호스팅, Sustainable Use License) / paid (n8n Cloud)
  needs: [n8n 인스턴스(2.x, MCP 기능별 최소 버전 상이), owner/admin 권한, 연결 대상 서비스 자격증명]
  overlaps: [zapier-mcp, make-mcp]
  risks: MCP에 연결된 모든 클라이언트가 허용된 워크플로 전부를 본다(클라이언트별 제한 없음). Auto-expose를 켜면 새 워크플로가 자동 노출된다. 2.13.0+에서는 MCP로 워크플로 생성·수정까지 가능해 쓰기 권한이 크다. API 토큰은 한 번만 보이고 재발급 시 이전 토큰이 폐기된다. n8n 안에 저장된 각 서비스 자격증명이 워크플로를 통해 간접 노출된다. 라이선스는 OSI 오픈소스가 아니다(상업 재판매 제한).
