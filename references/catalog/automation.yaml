- id: github-mcp
  name: GitHub MCP Server
  kind: mcp
  area: automation
  also: [coding]
  what: GitHub 공식 MCP 서버로, Claude Code가 이슈·PR·저장소·Actions 정보를 API로 읽고 쓰게 한다.
  when: 로컬 세션이나 예약 작업에서 이슈 생성, PR 목록 정리, 워크플로 실행 결과 확인을 Claude에게 맡길 때.
  not_when: gh CLI로 충분한 단순 작업(컨텍스트 비용이 더 적음), 쓰기 권한이 필요 없는데 기본 툴셋을 그대로 켤 때(--read-only 사용). gh CLI가 깔려 있으면 Bash로 충분하다(도구 스키마만큼 컨텍스트를 덜 쓴다).
  install: |
    # 원격(PAT)
    claude mcp add --transport http github https://api.githubcopilot.com/mcp -H "Authorization: Bearer YOUR_GITHUB_PAT"
    # 로컬 Docker(OAuth): claude mcp add github -e GITHUB_OAUTH_CALLBACK_PORT=8085 -- docker run -i --rm -p 127.0.0.1:8085:8085 -e GITHUB_OAUTH_CALLBACK_PORT ghcr.io/github/github-mcp-server
    # Windows: claude mcp add-json 이 HTTP 서버에서 Invalid input 을 낼 수 있어 위의 --transport http 형식을 쓰라고 공식 가이드가 안내
    # 또는 /plugin install github@claude-plugins-official
    # 툴셋 제한: --toolsets repos,issues,pull_requests / 읽기 전용: --read-only
  verify: Claude Code 재시작 후 `claude mcp list` 와 `claude mcp get github` 로 연결 확인 → 읽기 전용 요청(내 저장소의 열린 이슈 목록) 1회.
  repo: https://github.com/github/github-mcp-server
  docs: https://github.com/github/github-mcp-server/blob/main/docs/installation-guides/install-claude.md
  license: MIT
  stars: 34264
  last_push: 2026-11-05
  maintained: true
  cost: needs account
  needs: [GitHub 계정, PAT 또는 OAuth, Docker(로컬 방식)]
  overlaps: [claude-code-action, commit-commands]
  risks: PAT를 명령줄에 직접 넣으면 셸 기록·설정 파일(.claude.json)에 평문으로 남는다. 최소 스코프·저장소 한정 fine-grained 토큰을 쓰고 주기적으로 교체한다. 기본 툴셋에 쓰기 도구가 포함되므로 필요 없으면 --read-only. 도구 수가 많아 컨텍스트를 차지한다(--toolsets로 축소).
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://github.com/github/github-mcp-server
  - https://github.com/github/github-mcp-server/blob/main/docs/installation-guides/install-claude.md
  - https://api.github.com/repos/github/github-mcp-server

- id: ntfy
  name: ntfy
  kind: service
  area: automation
  what: HTTP POST 한 번으로 휴대폰·데스크톱에 푸시 알림을 보내는 오픈소스 pub-sub 알림 서비스로, 공개 서버(ntfy.sh)나 자체 호스팅으로 쓴다.
  when: 훅·예약 작업·CI가 끝났을 때 계정 연동 없이 휴대폰으로 짧은 알림을 받고 싶을 때.
  not_when: 알림 내용에 민감 정보가 들어갈 때(공개 서버 토픽은 이름만 알면 구독 가능), 팀 채널에 기록이 남아야 할 때(Slack·이슈가 맞음).
  install: |
    휴대폰에 ntfy 앱 설치 후 추측하기 어려운 토픽 구독.
    전송(bash): curl -d "작업 완료" ntfy.sh/<토픽>
    전송(Windows PowerShell): Invoke-RestMethod -Method POST -Uri "https://ntfy.sh/<토픽>" -Body "작업 완료"
    Claude Code 연동: Notification/Stop 훅의 command에 위 명령을 넣음. CI에서는 run 단계에서 curl.
    자체 호스팅: docs.ntfy.sh 의 install 문서.
  verify: 위 curl/Invoke-RestMethod를 한 번 실행해 휴대폰 알림 수신 확인.
  repo: https://github.com/binwiederhier/ntfy
  docs: https://docs.ntfy.sh/publish/
  license: Apache-2.0
  stars: 35319
  last_push: 2026-11-04
  maintained: true
  cost: free (공개 서버 기본 사용; 유료 플랜·자체 호스팅 선택 가능)
  needs: [ntfy 앱 또는 웹 구독, 자체 호스팅 시 서버]
  overlaps: [claude-code-hooks]
  risks: 공개 서버의 토픽 이름은 사실상 비밀번호다. 이름이 새면 누구나 알림을 읽거나 스팸을 보낼 수 있다. 접근 토큰을 쓰면 그 토큰을 CI Secrets에 보관해야 한다. 알림 본문엔 링크만 넣고 로그·비밀값을 넣지 않는다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://docs.ntfy.sh/publish/
  - https://github.com/binwiederhier/ntfy
  - https://api.github.com/repos/binwiederhier/ntfy
