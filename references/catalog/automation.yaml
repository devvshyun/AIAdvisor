  needs: [Zapier 계정, 연결할 각 앱 계정]
  overlaps: [n8n-mcp, make-mcp]
  risks: 에이전트가 반복 호출하면 작업 한도가 빠르게 소진된다. 앱 자격증명은 Zapier에 보관되지만 허용한 액션 범위 안에서 메일 발송·데이터 삭제 같은 쓰기가 가능하므로 액션을 최소로 고른다. 연결 토큰/토큰 URL은 비밀값이다. 에이전트가 "맞는 액션이 없으면 코드를 작성해 실행"할 수 있다고 소개된다.
