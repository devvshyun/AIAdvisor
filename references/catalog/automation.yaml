- id: make-mcp
  name: Make MCP server (cloud)
  kind: mcp
  area: automation
  what: Make(구 Integromat)가 호스팅하는 MCP 서버로, 활성화된 온디맨드 시나리오를 Claude의 도구로 실행하고 유료 플랜에선 시나리오·연결을 관리하게 한다.
