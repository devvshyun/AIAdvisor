# area: coding
# 형식은 SCHEMA.md, 갱신 절차는 REFRESH.md. 기준일은 항목마다 source_checked.

- id: superpowers
  name: Superpowers
  kind: plugin
  area: coding
  what: 브레인스토밍, 계획 작성, 레드-그린 TDD, 체계적 디버깅, 완료 전 검증 같은 개발 절차를 스킬로 묶어 Claude가 작업마다 따르게 만드는 플러그인이다.
  when: 기능 개발이나 버그 수정을 즉흥적으로 하지 않고 계획→테스트→검증 순서로 강제하고 싶을 때, 서브에이전트로 작업을 쪼개 리뷰까지 돌리고 싶을 때.
  not_when: 한 줄 수정이나 탐색성 질문 위주라 절차가 오히려 부담일 때, ECC 같은 다른 워크플로 플러그인을 이미 상시로 쓰고 있을 때.
  install: |
    /plugin install superpowers@claude-plugins-official
    # 또는 저자 마켓플레이스:
    /plugin marketplace add obra/superpowers-marketplace
    /plugin install superpowers@superpowers-marketplace
  verify: 새 세션에서 /plugin list에 superpowers가 enabled로 보이고, "/superpowers:" 입력 시 brainstorming·writing-plans 등 스킬이 자동완성되는지 확인.
  repo: https://github.com/obra/superpowers
  docs: https://github.com/obra/superpowers#readme
  license: MIT
  stars: 313023
  last_push: 2026-11-03
  maintained: true
  cost: free
  needs: Claude Code 플러그인 지원
  overlaps: [ecc, feature-dev]
  risks: SessionStart 훅으로 using-superpowers 지시를 매 세션(그리고 compact 후) 주입하므로 스킬 호출이 잦아지고 단순 작업도 절차가 길어질 수 있다. 다른 워크플로 플러그인과 지시가 충돌할 수 있다.
  always_on_tokens: null
  hands_on: '2026-11-06: 연습용 저장소에서 brainstorming, writing-plans로 설계와 계획을 쓰고 TDD로 구현했다. 질문이 하나씩 이어져 작은 기능에는 길게 느껴졌다(사용자가 세 번째 질문에서 "묻지 말고 진행"을 골랐다). 계획에 코드 전문을 적어서 실행 중 코드가 바뀌면 계획과 어긋난다'
  source_checked: 2026-11-06
  sources:
  - https://github.com/obra/superpowers
  - https://raw.githubusercontent.com/anthropics/claude-plugins-official/main/.claude-plugin/marketplace.json

- id: context7
  name: Context7
  kind: mcp
  area: coding
  what: 라이브러리 이름과 질문을 주면 해당 버전의 최신 공식 문서와 코드 예시를 찾아 Claude에게 넘겨 주는 문서 조회 서비스로, CLI+스킬 방식과 MCP 방식 둘 다 지원한다.
  when: 빠르게 바뀌는 프레임워크(Next.js, Supabase 등)나 학습 시점 이후 버전의 API를 쓸 때, 존재하지 않는 함수를 지어내는 문제가 잦을 때.
  not_when: 표준 라이브러리 위주이거나 사내 비공개 라이브러리라 색인에 없을 때, 외부로 질의 내용을 보내면 안 되는 환경일 때.
  install: |
    # 권장(대화형, OAuth로 API 키 발급 후 CLI+Skills 또는 MCP 선택; Node.js 22.13+)
    npx ctx7 setup --claude
    # 수동 MCP(원격 HTTP)
    claude mcp add --scope user --header "Authorization: Bearer YOUR_API_KEY" --transport http context7 https://mcp.context7.com/mcp
    # 또는 공식 마켓플레이스 플러그인
    /plugin install context7@claude-plugins-official
    # Windows: 원격 HTTP 방식은 그대로 동작. 로컬 npx 방식을 JSON 설정으로 넣을 때는 command를 cmd, args 앞에 /c 를 두라고 Context7 문서가 안내함.
  verify: claude mcp list 에서 context7가 Connected인지 확인(MCP 방식), 또는 npx ctx7 library react "hooks" 가 라이브러리 ID를 반환하는지 확인(CLI 방식). 세션에서 "use context7"를 붙인 질문에 resolve-library-id 호출이 일어나는지 본다.
  repo: https://github.com/upstash/context7
  docs: https://context7.com/docs
  license: MIT
  stars: 64251
  last_push: 2026-11-05
  maintained: true
  cost: needs account
  needs: Node.js 22.13+ (CLI), 무료 API 키 권장(없으면 낮은 rate limit)
  overlaps: []
  risks: 질의 내용이 Upstash 서버로 전송된다. 색인된 문서가 커뮤니티 제출분일 수 있어 출처 확인이 필요하다. MCP 방식은 도구 스키마가 상시 컨텍스트를 차지한다(CLI+스킬 방식이 더 가볍다).
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://github.com/upstash/context7
  - https://context7.com/docs/resources/all-clients

- id: ecc
  name: Everything Claude Code (ECC)
  kind: plugin
  area: coding
  what: 에이전트 71개, 스킬 314개, 레거시 명령 98개와 훅·규칙·메모리·보안 스캔(AgentShield)을 한 번에 깔아 주는 대형 하네스 설정 모음이다.
  when: 여러 하네스(Claude Code, Codex, Cursor 등)에 같은 규칙·스킬 세트를 깔고 싶을 때, 프로필로 필요한 기능만 골라 설치할 여유가 있을 때.
  not_when: superpowers 등 다른 워크플로 플러그인을 이미 쓰고 있을 때, 컨텍스트를 아껴야 하거나 무엇이 설치되는지 하나하나 통제하고 싶을 때.
  install: |
    # 권장: 가이드 설치(스코프·훅 프로필 선택)
    npx ecc-universal@2.2.3 setup
    # 또는 Claude Code 네이티브
    /plugin marketplace add https://github.com/affaan-m/ECC
    /plugin install ecc@ecc
    # 훅 없이 최소 설치: npx ecc-universal@2.2.3 install --profile minimal --target claude
    # Windows 수동 설치: .\install.ps1 --profile minimal --target claude
  verify: 새 세션에서 /plugin list 로 ecc@ecc 가 enabled인지 확인(README 안내). npx ecc-universal@2.2.3 doctor --target claude 로 점검.
  repo: https://github.com/affaan-m/ECC
  docs: https://github.com/affaan-m/ECC#readme
  license: MIT
  stars: 297876
  last_push: 2026-11-02
  maintained: true
  cost: free
  needs: Node.js(npx)
  overlaps: [superpowers, feature-dev, pr-review-toolkit, claude-code-hooks]
  risks: 규모가 매우 커서 스킬 목록·훅이 컨텍스트와 지연을 늘릴 수 있다. 설치 방법을 섞으면 스킬·훅이 중복된다고 README가 직접 경고한다. 저장소 이름이 everything-claude-code에서 ECC로 바뀌어 예전 글의 명령이 다를 수 있다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://github.com/affaan-m/ECC
  - https://github.com/affaan-m/everything-claude-code

- id: graphify
  name: graphify
  kind: skill
  area: coding
  what: 코드(tree-sitter AST)와 문서·PDF·이미지를 지식 그래프로 만들고, Claude가 파일을 통째로 읽는 대신 그래프 질의로 구조를 찾게 하는 CLI 겸 스킬이다.
  when: 처음 보는 대형 코드베이스나 코드+설계문서가 섞인 저장소에서 "무엇이 무엇과 연결되나"를 빨리 파악해야 할 때.
  not_when: 파일 수가 적어 컨텍스트에 그냥 들어가는 작은 프로젝트(README 자체 예시에서도 6파일은 절감 ~1x), 다른 코드 그래프/내비게이션 도구를 이미 상시로 쓸 때.
  install: |
    uv tool install graphifyy      # 또는 pipx install graphifyy (PyPI 이름은 graphifyy)
    graphify install               # 사용 중인 어시스턴트를 감지해 스킬 등록
    # Windows: winget install astral-sh.uv 로 uv 설치 후 동일. 감지가 안 되면 graphify install --platform windows
    # (선택) 그래프 우선 사용 훅: graphify claude install
  verify: Claude Code에서 /graphify . 실행 후 graphify-out/graph.json 과 GRAPH_REPORT.md 가 생성되는지 확인. graphify query "<질문>" 이 결과를 내는지 확인.
  repo: https://github.com/Graphify-Labs/graphify
  docs: https://docs.graphify.com
  license: Apache-2.0
  stars: 142992
  last_push: 2026-11-05
  maintained: true
  cost: free
  needs: Python 3.10+, uv 또는 pipx
  overlaps: [understand-anything, serena, lsp-plugins]
  risks: graphify claude install 을 실행하면 Read/Glob/grep류 호출 전에 훅이 그래프 사용을 유도해 도구 선택에 개입한다. 문서·이미지 의미 추출 단계는 LLM 백엔드를 호출해 비용이 든다. README에 유료 Graphify Cloud 홍보가 섞여 있다. 저장소가 safishamsi/graphify에서 Graphify-Labs/graphify로 옮겨졌다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://github.com/Graphify-Labs/graphify
  - https://docs.graphify.com

- id: serena
  name: Serena
  kind: mcp
  area: coding
  what: 언어 서버(또는 JetBrains 플러그인)를 이용해 심볼 단위 검색·참조 추적·심볼 본문 교체 같은 의미 기반 탐색과 편집 도구를 MCP로 제공한다.
  when: 대형 저장소에서 파일 전체를 읽지 않고 함수·클래스 단위로 찾아 고치고 싶을 때, 여러 언어가 섞인 코드베이스에서 리팩터링 정확도가 중요할 때.
  not_when: 작은 프로젝트이거나 공식 LSP 플러그인만으로 충분할 때, MCP 서버를 추가로 상주시키기 싫을 때.
  install: |
    uv tool install -p 3.13 serena-agent
    serena init
    claude mcp add --scope user serena -- serena start-mcp-server --context claude-code --project-from-cwd
    # 또는 serena setup claude-code
    # Windows: Claude Code가 serena를 못 찾으면 serena 실행 파일의 전체 경로를 쓰라고 문서가 안내함.
    # 주의: README는 MCP/플러그인 마켓플레이스 경유 설치를 하지 말라고 명시(공식 마켓플레이스에 serena 항목이 있어도).
  verify: Claude Code에서 /mcp 로 serena 연결 확인. 시작이 느리면 MCP_TIMEOUT=60000 설정.
  repo: https://github.com/oraios/serena
  docs: https://oraios.github.io/serena/
  license: GPL-3.0-or-later (SolidLSP 부분은 MIT; API spdx_id는 NOASSERTION)
  stars: 31133
  last_push: 2026-10-28
  maintained: true
  cost: free
  needs: uv, Python 3.13(uv가 관리), 언어별 language server
  overlaps: [lsp-plugins, graphify, understand-anything]
  risks: MCP 도구 스키마가 상시 컨텍스트를 차지한다. 자체 메모리 기능이 Claude Code의 메모리와 겹칠 수 있다(끌 수 있음). 언어 서버별 추가 설치가 필요할 수 있다. 애플리케이션 본체가 GPL-3.0-or-later라 재배포·번들 시 라이선스 의무를 확인해야 한다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://github.com/oraios/serena
  - https://oraios.github.io/serena/02-usage/030_clients.html

- id: builtin-code-review
  name: Claude Code /code-review (내장 스킬)
  kind: built-in
  area: coding
  what: 현재 브랜치 diff나 지정한 PR·브랜치·경로를 정확성 버그 위주로 리뷰하고, 노력 단계를 고르거나 --fix로 바로 고치거나 --comment로 PR에 남기는 내장 명령이다.
  when: 커밋·PR 전에 버그를 한 번 걸러야 할 때, 별도 설치 없이 리뷰 단계를 워크플로에 넣고 싶을 때.
  not_when: 스타일·구조 정리만 원할 때(/simplify가 그 용도), 보안 취약점 점검이 목적일 때(/security-review).
  install: 설치 불필요(Claude Code 번들 스킬). 예) /code-review high, /code-review --fix, /code-review high 1234
  verify: 프롬프트에서 / 입력 후 code-review 와 별칭 review 가 목록에 보이는지 확인.
  repo: null
  docs: https://code.claude.com/docs/en/code-review-local
  license: null
  stars: null
  last_push: null
  maintained: true
  cost: free
  needs: Claude Code, git 저장소(PR 대상이면 gh 또는 GitLab 연동)
  overlaps: [pr-review-toolkit]
  risks: 노력 단계를 지정하지 않으면 마지막으로 입력한 단계를 재사용한다. ultra 단계는 클라우드에서 돌고 무료 횟수 이후 사용량 크레딧이 든다. high 이상은 토큰을 많이 쓴다.
  always_on_tokens: null
  hands_on: '2026-11-06: 연습용 CLI(Python 30줄 남짓)에 /code-review high를 돌려 8건을 받았고 모두 실제로 고칠 만했다(전각 숫자 허용, 앞자리 0, 전역 출력 변경 등)'
  source_checked: 2026-11-06
  sources:
  - https://code.claude.com/docs/en/commands
  - https://code.claude.com/docs/en/code-review-local

- id: builtin-security-review
  name: Claude Code /security-review (내장)
  kind: built-in
  area: coding
  what: 현재 브랜치와 origin 기본 브랜치의 차이를 읽고 인젝션, 인증 문제, 데이터 노출 같은 보안 위험을 찾아 주는 내장 명령이다.
  when: 인증·입력 처리·비밀값·외부 호출을 건드린 변경을 PR 전에 점검할 때.
  not_when: origin 원격이 없는 로컬 전용 저장소(실패함), 저장소 전체 감사가 필요할 때(claude-security 쪽이 맞다).
  install: 설치 불필요. /security-review
  verify: / 입력 시 security-review 가 보이는지 확인. origin 이 없으면 'ambiguous argument' 오류가 나므로 git remote -v 로 origin 확인.
  repo: null
  docs: https://code.claude.com/docs/en/commands
  license: null
  stars: null
  last_push: null
  maintained: true
  cost: free
  needs: Claude Code, origin 원격이 있는 git 저장소
  overlaps: [claude-security, security-guidance, claude-code-security-review-action, semgrep-guardian]
  risks: LLM 판단이라 놓치는 것과 오탐이 있다. diff 범위만 보므로 기존 코드의 취약점은 대상이 아니다.
  always_on_tokens: null
  hands_on: '2026-11-06: origin 원격이 없으면 git diff origin/HEAD...에서 바로 실패했다. 빈 로컬 저장소를 origin으로 붙여 돌렸고, 로컬 CLI라 발견은 0건이었다'
  source_checked: 2026-11-06
  sources:
  - https://code.claude.com/docs/en/commands

- id: security-guidance
  name: security-guidance (Anthropic 공식 플러그인)
  kind: plugin
  area: coding
  what: Claude가 편집할 때 위험 패턴 정규식 경고를 띄우고, 턴이 끝날 때 diff를 LLM으로 보안 리뷰하며, git commit 때는 에이전트가 파일을 따라가며 다중 파일 취약점까지 보는 3단 보안 가드이다.
  when: Claude가 쓴 코드를 커밋 전에 자동으로 보안 점검하고 싶을 때, 사람이 매번 /security-review 를 잊는 팀일 때.
  not_when: 사용량 한도가 빠듯한 구독 환경(턴마다 추가 LLM 호출), 다른 편집 훅 기반 보안 스캐너를 이미 상시로 돌릴 때.
  install: |
    /plugin install security-guidance@claude-plugins-official
    # Windows 일부 환경: SG_AGENTIC_CLI_PATH 에 Claude Code 전체 경로 지정 필요
  verify: /plugin list 에서 활성 확인 후 일부러 위험 패턴(예 yaml.load)을 쓰게 해 경고가 나오는지, ~/.claude/security/log.txt 에 리뷰 기록이 남는지 확인.
  repo: https://github.com/anthropics/claude-plugins-official
  docs: https://code.claude.com/docs/en/security-guidance
  license: Apache-2.0
  stars: 46230
  last_push: 2026-11-06
  maintained: true
  cost: free
  needs: Claude Code v2.1.144+, Python 3.8+, Claude 로그인 또는 API 키
  overlaps: [semgrep-guardian, builtin-security-review, claude-security]
  risks: 턴 종료마다 LLM 호출 1회(기본 최신 Opus)와 커밋마다 에이전트 리뷰가 돌아 비용·사용량이 는다(SECURITY_REVIEW_MODEL 로 낮출 수 있음). diff와 관련 파일 내용이 설정된 모델 엔드포인트로 전송된다.
  always_on_tokens: null
  source_checked: 2026-11-06
  sources:
  - https://github.com/anthropics/claude-plugins-official/tree/main/plugins/security-guidance

- id: claude-security
  name: claude-security (Anthropic 공식 플러그인)
  kind: plugin
  area: coding
