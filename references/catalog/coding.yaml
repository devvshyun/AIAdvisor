- id: gitleaks
  name: 'Gitleaks (후속: Betterleaks)'
  kind: cli
  area: coding
  also: [automation]
  what: git 기록, 디렉터리, 표준입력에서 비밀번호·API 키·토큰 같은 비밀값을 정규식과 엔트로피 규칙으로 찾아내는 결정적 스캐너이다.
  when: Claude가 커밋을 만드는 저장소에서 비밀값 유출을 pre-commit 단계에서 확실히 막고 싶을 때, CI에 가벼운 비밀키 검사를 넣을 때. 자동화로 Secrets가 늘어날 때 CI 단계 유출 차단에도 쓴다.
  not_when: 코드 취약점(인젝션 등)을 찾으려 할 때(범위 밖). 새로 도입하며 장기 유지보수를 기대할 때(README가 기능 완료·보안 패치만 예고하고 Betterleaks를 안내).
  install: |
    brew install gitleaks          # macOS
    # Windows: GitHub releases 페이지의 바이너리 사용 또는 docker run ghcr.io/gitleaks/gitleaks:latest
    # pre-commit: .pre-commit-config.yaml 에 repo https://github.com/gitleaks/gitleaks, hook id gitleaks 추가 후 pre-commit install
    # CI: gitleaks/gitleaks-action (조직 저장소 라이선스 조건은 액션 README 확인)
    # 후속작 Betterleaks: brew install betterleaks / go install github.com/betterleaks/betterleaks/v2@latest (v2 개발 중)
  verify: gitleaks version 출력 확인, gitleaks git -v 로 저장소 스캔, 테스트용 가짜 키를 커밋하려 할 때 pre-commit이 Failed 로 막는지 확인.
